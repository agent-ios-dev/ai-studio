name: Publish beta site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble public site
        env:
          CHAT_API_URL: ${{ vars.CHAT_API_URL }}
        run: |
          mkdir _site
          cp index.html admin.html styles.css admin.css app.js markdown.js liquid-glass.js admin.js favicon.svg favicon.ico apple-touch-icon.png manifest.webmanifest _site/
          cp -r vendor _site/vendor
          cp -r assets _site/assets
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('_site/config.js').write_text('window.CHAT_API_URL = ' + json.dumps(os.environ['CHAT_API_URL']) + ';\n', encoding='utf-8')
          page = Path('_site/index.html')
          page.write_text(page.read_text(encoding='utf-8').replace('./app.js"', './app.js?v=' + os.environ['GITHUB_SHA'] + '"').replace('./styles.css"', './styles.css?v=' + os.environ['GITHUB_SHA'] + '"'), encoding='utf-8')
          app = Path('_site/app.js')
          app.write_text(app.read_text(encoding='utf-8').replace('./markdown.js"', './markdown.js?v=' + os.environ['GITHUB_SHA'] + '"').replace('./liquid-glass.js"', './liquid-glass.js?v=' + os.environ['GITHUB_SHA'] + '"'), encoding='utf-8')
          admin_page = Path('_site/admin.html')
          admin_page.write_text(admin_page.read_text(encoding='utf-8').replace('./admin.js"', './admin.js?v=' + os.environ['GITHUB_SHA'] + '"').replace('./admin.css"', './admin.css?v=' + os.environ['GITHUB_SHA'] + '"'), encoding='utf-8')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
